repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - fastapi>=0.115
          - sqlalchemy>=2.0
          - redis>=5.0

# 闭环 v2 防线④: 金标回归集 — 改词表/阈值/路由必须过历史修复用例
- repo: local
  hooks:
    - id: golden-regression
      name: golden regression (历史 badcase 修复用例)
      entry: bash -c 'cd agent && poetry run pytest tests/test_golden_regression.py -q'
      language: system
      pass_filenames: false
      files: ^(agent/lumio/|agent/data/policy/|agent/data/golden/)
