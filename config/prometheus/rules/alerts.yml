# Lumio 告警规则
# 覆盖：服务下线、工具错误率、LLM 延迟、会话超时激增、LLM 降级（熔断）。
# 加载方式：prometheus.yml 的 rule_files 引用本文件。默认无 Alertmanager 也可在
# Prometheus UI 的 Alerts 页查看触发状态；如需通知可 opt-in 启动 Alertmanager。
groups:
  - name: lumio-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"bot-service|assist-service|mcp-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 不可达"
          description: "{{ $labels.job }}（{{ $labels.instance }}）已下线超过 1 分钟。"

  - name: lumio-tools
    rules:
      # Java MCP 工具错误率 > 10%（5 分钟窗口）
      - alert: MCPToolErrorRateHigh
        expr: >-
          sum(rate(mcp_tool_calls_total{outcome="error"}[5m]))
          /
          clamp_min(sum(rate(mcp_tool_calls_total[5m])), 1e-9) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP 工具错误率偏高"
          description: "近 5 分钟 MCP 工具错误率超过 10%。"

      # Python 侧工具调用错误率 > 10%
      - alert: PyToolErrorRateHigh
        expr: >-
          sum(rate(tool_calls_total{status="error"}[5m]))
          /
          clamp_min(sum(rate(tool_calls_total[5m])), 1e-9) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "编排层工具调用错误率偏高"
          description: "近 5 分钟编排层 MCP 工具调用错误率超过 10%。"

  - name: lumio-latency
    rules:
      # LLM 调用 p99 > 15s
      - alert: LLMLatencyP99High
        expr: histogram_quantile(0.99, sum(rate(llm_call_duration_seconds_bucket[5m])) by (le)) > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM 调用延迟 p99 偏高"
          description: "近 5 分钟 LLM 调用 p99 延迟超过 15 秒。"

      # HTTP 请求 p99 > 5s
      - alert: HTTPLatencyP99High
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 请求延迟 p99 偏高"
          description: "近 5 分钟 HTTP 请求 p99 延迟超过 5 秒。"

  - name: lumio-sessions
    rules:
      # 会话超时激增：每秒超时事件 > 1
      - alert: SessionTimeoutSpike
        expr: sum(rate(session_timeouts_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "会话超时事件激增"
          description: "近 5 分钟会话超时速率超过 1 次/秒，可能存在坐席/处理瓶颈。"

  - name: lumio-rag
    rules:
      # 检索 p95 > 4s（bucket 阈值 4s 处的分位数，10 分钟窗口）
      - alert: RAGRetrievalP95High
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(lumio_retrieval_duration_seconds_bucket[10m])) by (le, search_type)
          ) > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAG 检索 p95 延迟偏高 ({{ $labels.search_type }})"
          description: "{{ $labels.search_type }} 检索 p95 延迟超过 4 秒持续 10 分钟。"

      # 系统持续降级（degradation_level >= 1）超过 5 分钟
      - alert: RAGDegradationSustained
        expr: max(lumio_degradation_level) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "系统持续处于降级状态"
          description: "降级等级 {{ $value }} 已持续 5 分钟以上（1=degraded, 2=fallback）。"

      # FAQ 命中率跌破 50%（10 次以上检索的窗口内）
      - alert: FAQHitRateDrop
        expr: >-
          sum(rate(lumio_faq_match_total{match_type!="miss"}[15m]))
          /
          clamp_min(sum(rate(lumio_faq_match_total[15m])), 1e-9) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "FAQ 命中率跌破 50%"
          description: "近 15 分钟 FAQ 精确+语义命中率低于 50%，检查知识库/FAQ 发布状态。"

      # 检索缓存命中率低于 10%（说明缓存几乎不生效, 或查询模式极度分散）
      - alert: RAGCacheHitRateLow
        expr: >-
          sum(rate(lumio_rag_cache_ops_total{result="hit"}[30m]))
          /
          clamp_min(sum(rate(lumio_rag_cache_ops_total[30m])), 1e-9) < 0.1
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "RAG 检索缓存命中率偏低"
          description: "近 30 分钟检索缓存命中率不足 10%。"
